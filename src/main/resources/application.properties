spring.application.name=viewspace
server.port=8080

spring.datasource.url=${URL}
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.mail.host = smtp.gmail.com
spring.mail.port = 587
spring.mail.username = ${MAIL_USERNAME}
spring.mail.password = ${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.properties.mail.smtp.starttls.required = true


app.jwt.secret = ${JWT_SECRET}
app.jwt.expiration-ms=86400000



# Comma-separated list of allowed frontend origins for CORS.
# Locally this falls back to http://localhost:5173 if ALLOWED_ORIGINS isn't set.
# On Render, set ALLOWED_ORIGINS=http://localhost:5173,https://your-app.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}