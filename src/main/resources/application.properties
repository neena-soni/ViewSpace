app.jwt.secret = ${JWT_SECRET}
app.jwt.expiration-ms=86400000



#FILE UPLOAD LIMITS
# Single file ka maximum size 1MB (file which user upload)
spring.servlet.multipart.max-file-size=1MB
# Poori request ka maximum size 1MB
spring.servlet.multipart.max-request-size=1MB



#CORS CONFIGURATION
# Comma-separated list of allowed frontend origins for CORS.
# Locally this falls back to http://localhost:5173 if ALLOWED_ORIGINS isn't set.
# On Render, set ALLOWED_ORIGINS=http://localhost:5173,https://your-app.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}





# Brevo SMTP Relay Settings for JavaMailSender
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_LOGIN_ID}  

spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required = true



emails.sender_email = ${MAIL_ID}








